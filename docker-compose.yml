services:
  tanden-boxing:
    build: .
    image: tanden-boxing
    container_name: tanden-boxing
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      # Obligatoire — clé API OpenRouter (jamais commitée ni exposée au navigateur).
      NUXT_OPENROUTER_API_KEY: ${NUXT_OPENROUTER_API_KEY:?Renseigne NUXT_OPENROUTER_API_KEY}
      NUXT_OPENROUTER_HTTP_REFERER: ${NUXT_OPENROUTER_HTTP_REFERER:-}
      NUXT_OPENROUTER_APP_TITLE: ${NUXT_OPENROUTER_APP_TITLE:-Tanden Boxing}
      NUXT_OPENROUTER_REQUIRE_ZDR: ${NUXT_OPENROUTER_REQUIRE_ZDR:-1}
      NUXT_AI_MODEL: ${NUXT_AI_MODEL:-anthropic/claude-opus-4.8}
      NUXT_TIMEZONE: ${NUXT_TIMEZONE:-Europe/Paris}
      NUXT_DATABASE_PATH: /app/data/tanden.db
    volumes:
      - tanden-data:/app/data

volumes:
  tanden-data:
